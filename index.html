<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="50 Days">
<meta name="theme-color" content="#0b0d0c">
<title>50 Day Challenge</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="ico" href="">
<style>
:root{--bg:#0b0d0c;--card:#151917;--card2:#1c211f;--line:#262c29;--tx:#fff;--mut:#8a948f;--g:#2ee072;--gd:#14472a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:13px;letter-spacing:.14em;color:var(--mut);margin:6px 0 14px;font-weight:600;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:13px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.g{color:var(--g)}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
button,input{font:inherit;color:inherit}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:600;min-height:44px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--g);color:#04170b;border-color:var(--g)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:64px;padding:11px 6px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid #3a4540;display:grid;place-items:center;flex:none;background:none;transition:.2s}
.chk.on{background:var(--g);border-color:var(--g)}
.chk svg{width:18px;opacity:0}.chk.on svg{opacity:1}
.top{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(14,17,16,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;min-height:48px;cursor:pointer}
nav button.on{color:var(--g)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=number],input[type=date],input[type=time]{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;min-height:44px;outline:none}
input:focus{border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:12px;color:var(--mut);border:1px solid transparent;cursor:pointer}
.cell.f{background:var(--g);color:#04170b;font-weight:700}

.cell.fu{background:none;border:1px dashed var(--line);cursor:default}
.cell.t{border-color:#fff}
.wk{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:10px}
.wk div{flex:1;background:var(--g);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.wk span{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);margin-top:3px}
.sw{width:50px;height:30px;border-radius:20px;background:#333b37;border:0;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:23px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:496px;margin:0 auto;background:var(--g);color:#04170b;padding:14px 16px;border-radius:16px;font-weight:700;transform:translateY(-140%);transition:.35s;z-index:9}
#toast.s{transform:none}
.sheet{background:var(--card2);border-radius:18px;padding:14px;margin-top:12px}
.warn{background:#2a2410;border:1px solid #5a4a14;color:#f1d98a;border-radius:14px;padding:12px;font-size:13px}
.hr{height:1px;background:var(--line);margin:14px 0}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.chk.pop{animation:pop .35s ease}.chk{cursor:pointer}
.card{transition:border-color .3s}.card.ok{border-color:#1d5a37}
.tap{cursor:pointer}.tap:active{opacity:.7}
.mini{display:flex;gap:8px;margin-top:10px}
.nv{background:none;border:0;color:var(--mut);font-size:30px;line-height:1;padding:4px 16px;min-height:44px;cursor:pointer}.nv:disabled{opacity:.2}
.ring.full svg{filter:drop-shadow(0 0 8px rgba(46,224,114,.45))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
circle[data-k]{transition:stroke-dashoffset .6s ease}
.cell{transition:background .3s}
.d14{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:10px}.d14 div{flex:1;background:var(--g);border-radius:4px 4px 1px 1px}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<nav id="nav"></nav>
<script>
const KEY='c50v1', N=50;
const REM0=[{id:'am',l:'Morning start',t:'07:30',on:true},{id:'w1',l:'Water check',t:'11:00',on:true},{id:'w2',l:'Water check',t:'15:00',on:true},{id:'rv',l:'Revision',t:'17:00',on:true},{id:'ev',l:'Evening checklist',t:'20:30',on:true},{id:'bd',l:'Not logged yet?',t:'22:30',on:true}];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T00:00:00');
const today=()=>ds(new Date());
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){try{const raw=localStorage.getItem(KEY);if(raw)localStorage.setItem(KEY+'_backup',raw)}catch(_){}}
if(!S||!S.start)S={start:today(),days:{},cheat:{},rem:REM0,remOn:true,timer:null,fired:{}};
S.days=S.days||{};S.cheat=S.cheat||{};S.fired=S.fired||{};S.rem=S.rem||[];
REM0.forEach(x=>{if(!S.rem.some(r=>r.id===x.id))S.rem.push({...x})});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const R=d=>S.days[d]||{};
function put(d,k,v){const o=flags(R(d));S.days[d]=Object.assign({},S.days[d],{[k]:v});save();const n=flags(R(d));pop=n.findIndex((x,i)=>x&&!o[i]);render();pop=-1;if(n.every(Boolean)&&!o.every(Boolean))toast('Perfect day. All 6 done.')}
function shift(n){const v=add(view,n);if(v>=S.start&&v<=today()){view=v;render()}}
function add_(k,n){put(view,k,Math.max(0,(R(view)[k]||0)+n))}
function cust(id,k,m){const v=parseFloat(document.getElementById(id).value);if(v>0)add_(k,Math.round(v*m));else toast('Enter an amount first')}
function setStart(v){if(!v){render();return}if(v!==S.start&&Object.keys(S.days).length&&!confirm('Your logs are kept, but Day 1 moves to this date. Continue?')){render();return}S.start=v;save();render()}
const flags=r=>[!!r.ex,(r.water||0)>=2000,(r.rev||0)>=120,(r.sleep||0)>=8,!!r.sugar,!!r.alc];
const cnt=d=>flags(R(d)).filter(Boolean).length;
const full=d=>cnt(d)===6;
const endDate=()=>add(S.start,N-1);
const dayNo=d=>diff(d,S.start)+1;
let tab='home',view=today(),sel=null,pop=-1,lastDay=today();
const names=['Exercise','Water','Revision','Sleep','No sugar','No alcohol or drugs'];

function elapsed(){const t=today(),e=endDate();const last=t<e?t:e;const out=[];for(let d=S.start;d<=last;d=add(d,1))out.push(d);return out}
function streaks(){const t=today(),e=elapsed();let cur=0,best=0,run=0;e.forEach(d=>{if(full(d)){run++;best=Math.max(best,run)}else run=0});
 for(let i=e.length-1;i>=0;i--){if(full(e[i]))cur++;else if(e[i]===t)continue;else break}return{cur,best}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),5000)}
const ic={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',progress:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',history:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const tick='<svg viewBox="0 0 24 24" fill="none" stroke="#04170b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function go(t){tab=t;sel=null;render();scrollTo(0,0)}
function nav(){document.getElementById('nav').innerHTML=['home','progress','history','settings'].map(t=>`<button class="${tab===t?'on':''}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${ic[t]}</svg>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}

function home(){
 const t=today(),r=R(view),past=view!==t,e=endDate();
 const shown=Math.min(Math.max(dayNo(t),0),N);
 const el=elapsed(),fd=el.filter(full).length,st=streaks();
 const c=cnt(view),pct=t<S.start?0:Math.round(shown/N*100),left=t<S.start?N:Math.max(0,N-shown);
 const C=2*Math.PI*56;
 const ff=flags(r),todo=[];if(!ff[0])todo.push('exercise');if(!ff[1])todo.push(`${2000-(r.water||0)}ml water`);if(!ff[2])todo.push(`${120-(r.rev||0)}min revision`);if(!ff[3])todo.push(`${+(8-(r.sleep||0)).toFixed(1)}h sleep`);if(!ff[4])todo.push('sugar');if(!ff[5])todo.push('alcohol/drugs');
 const nudge=c===6?'<div class="mut" style="margin-top:12px;text-align:center">Perfect day. Nothing left to do.</div>':`<div class="mut" style="margin-top:12px">Left: ${todo.join(', ')}${!past&&st.cur>0?` · keep your ${st.cur}-day streak alive`:''}</div>`;
 const head=t<S.start?`Starts in ${diff(S.start,t)}d`:t>e?'Challenge complete':`Day ${shown} of ${N}`;
 let h=`<div class="row" style="margin-bottom:8px"><button class="nv" onclick="shift(-1)" ${view<=S.start?'disabled':''}>‹</button><h1 style="margin:0;text-align:center">${past?'':'Today · '}${pd(view).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</h1><button class="nv" onclick="shift(1)" ${view>=t?'disabled':''}>›</button></div>
 <div class="card"><div class="top"><div class="ring ${c===6?'full':''}"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="#222927" stroke-width="10"/><circle data-k="ring" data-off="${C*(1-c/6)}" cx="66" cy="66" r="56" fill="none" stroke="#2ee072" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" transform="rotate(-90 66 66)"/></svg><b>${c}/6</b></div>
 <div style="flex:1"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">${head}</div><div class="mut">${left} days remaining</div><div class="bar"><i data-k="ov" data-w="${pct}"></i></div><div class="mut" style="margin-top:6px">${pct}% of challenge</div></div></div>
 <div class="stats"><div><b>${st.cur}</b><span class="mut">Streak</span></div><div><b>${fd}</b><span class="mut">Perfect days</span></div><div><b class="g">${Math.round(c/6*100)}%</b><span class="mut">${past?'That day':'Today'}</span></div></div>${nudge}</div>`;
 if(past)h+=`<div class="card row"><div><b>Editing ${pd(view).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b><div class="mut">Past day</div></div><button class="btn p" onclick="view=today();render()">Back to today</button></div>`;
 if(view<S.start||view>e)h+=`<div class="warn">This date is outside your challenge. You can still log, but it won’t count toward the 50 days.</div><div style="height:12px"></div>`;
 const f=flags(r);
 const K=(i,on)=>`<div class="chk ${on?'on':''} ${pop===i?'pop':''}">${tick}</div>`;
 const card=(i,x)=>`<div class="card ${f[i]?'ok':''}">${x}</div>`;
 const tg=(i,k,a,b)=>card(i,`<div class="row tap" onclick="put(view,'${k}',!R(view).${k})"><div><b>${a}</b><div class="mut">${b}</div></div>${K(i,f[i])}</div>`);
 const ex=[r.exN,r.exM?r.exM+' min':''].filter(Boolean).join(' · ');
 h+=card(0,`<div class="row tap" onclick="put(view,'ex',!R(view).ex)"><div><b>Exercise</b><div class="mut">${f[0]?(ex||'Done'):'Tap when done'}</div></div>${K(0,f[0])}</div>${f[0]?`<div class="mini"><input type="text" placeholder="What did you do? (optional)" value="${(r.exN||'').replace(/"/g,'&quot;')}" onchange="put(view,'exN',this.value)" style="flex:2"><input type="number" inputmode="numeric" placeholder="Min" value="${r.exM||''}" onchange="put(view,'exM',+this.value)" style="flex:1"></div>`:''}`);
 const w=r.water||0;
 h+=card(1,`<div class="row"><div><b>Water</b><div class="mut">${w} / 2000 ml</div></div>${K(1,f[1])}</div><div class="bar"><i data-k="wa" data-w="${Math.min(100,w/20)}"></i></div>
 <div class="btns"><button class="btn" onclick="add_('water',-250)">-250</button><button class="btn p" onclick="add_('water',250)">+250</button><button class="btn p" onclick="add_('water',500)">+500</button></div>
 <div class="mini"><input type="number" inputmode="numeric" id="cw" placeholder="Custom ml"><button class="btn" style="flex:none" onclick="cust('cw','water',1)">Add</button></div>`);
 const v=r.rev||0,tm=S.timer;
 h+=card(2,`<div class="row"><div><b>Revision</b><div class="mut">${v} / 120 min${v<120?` · ${120-v} left`:''}</div></div>${K(2,f[2])}</div><div class="bar"><i data-k="rv" data-w="${Math.min(100,v/1.2)}"></i></div>
 <div class="btns"><button class="btn p" onclick="timer()">${tm?'Stop and save':'Start timer'}</button>${tm?'<div class="btn" id="tv" style="text-align:center;font-variant-numeric:tabular-nums">00:00</div>':''}</div>
 <div class="btns"><button class="btn" onclick="add_('rev',-15)">-15</button><button class="btn" onclick="add_('rev',15)">+15</button><button class="btn" onclick="add_('rev',30)">+30</button><button class="btn" onclick="add_('rev',60)">+60</button></div>
 <div class="mini"><input type="number" inputmode="numeric" id="cr" placeholder="Custom minutes"><button class="btn" style="flex:none" onclick="cust('cr','rev',1)">Add</button></div>`);
 const sl=r.sleep||0;
 h+=card(3,`<div class="row"><div><b>Sleep</b><div class="mut">${sl} / 8 hours</div></div>${K(3,f[3])}</div><div class="bar"><i data-k="sl" data-w="${Math.min(100,sl/.08)}"></i></div>
 <div class="btns">${[6,7,8,9].map(x=>`<button class="btn ${sl===x?'p':''}" onclick="put(view,'sleep',${x})">${x}h</button>`).join('')}</div>
 <div class="btns"><button class="btn" onclick="add_('sleep',-.5)">-0.5h</button><button class="btn" onclick="add_('sleep',.5)">+0.5h</button></div>`);
 h+=tg(4,'sugar','No unnecessary sugar','Tap if you avoided it today');
 h+=tg(5,'alc','No alcohol or drugs','Tap if you stayed clean today');
 // cheat
 const wi=Math.floor(Math.max(0,diff(view,S.start))/7),used=S.cheat[wi];
 h+=`<div class="card"><div class="row"><div><b>Weekly cheat</b><div class="mut">Week ${wi+1} · 1 allowed · ${used?'Used on '+pd(used).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'Unused'}</div></div>${used?`<button class="btn" onclick="delete S.cheat[${wi}];save();render()">Undo</button>`:`<button class="btn p" onclick="S.cheat[${wi}]=view;save();render()">Log it</button>`}</div></div>`;
 return h}
function timer(){if(S.timer){const m=Math.round((Date.now()-S.timer.t)/60000);const d=S.timer.date;S.timer=null;put(d,'rev',(R(d).rev||0)+m);toast(m+' min added to revision')}else{S.timer={t:Date.now(),date:view};save();render()}}

function progress(){
 const el=elapsed(),n=el.length||1,fd=el.filter(full).length,st=streaks();
 const tot=k=>el.reduce((a,d)=>a+(R(d)[k]||0),0);
 const sl=el.filter(d=>R(d).sleep>0);
 const tp=Math.round(el.reduce((a,d)=>a+cnt(d),0)/(6*n)*100);
 const rates=[0,1,2,3,4,5].map(i=>Math.round(el.filter(d=>flags(R(d))[i]).length/n*100));
 let wk='';const t=today();
 for(let w=0;w<8;w++){const den=Math.min(7,N-w*7);let c=0,go=false;for(let i=0;i<den;i++){const d=add(S.start,w*7+i);if(d<=t){go=true;if(full(d))c++}}wk+=`<div style="height:${go?Math.max(3,c/den*100):3}%;${go?'':'opacity:.25'}"><span>${go?c+'/'+den:''}<br>W${w+1}</span></div>`}
 return `<h1>Progress</h1><div class="card"><div class="row"><div><div class="big g">${tp}%</div><div class="mut">of daily targets completed</div></div><div style="text-align:right"><b style="font-size:22px">${fd}</b><div class="mut">perfect days</div></div></div><div class="bar"><i style="width:${tp}%"></i></div></div>
 <div class="card"><div class="row"><div><b style="font-size:22px">${st.cur}</b><div class="mut">Current streak</div></div><div style="text-align:right"><b style="font-size:22px">${st.best}</b><div class="mut">Longest streak</div></div></div></div>
 <div class="card"><b>Daily consistency</b><div class="mut">Targets done per day, last 14 days</div><div class="d14">${el.slice(-14).map(d=>`<div style="height:${Math.max(4,cnt(d)/6*100)}%;${full(d)?'':'opacity:.45'}"></div>`).join('')}</div></div>
 <div class="card"><b>Weekly consistency</b><div class="mut">Perfect days per week</div><div class="wk" style="margin-bottom:34px">${wk}</div></div>
 <div class="card"><b>Habit completion</b>${names.map((x,i)=>`<div style="margin-top:12px"><div class="row"><span>${i===0?'Exercise consistency':x}</span><span class="mut">${rates[i]}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${rates[i]}%"></i></div></div>`).join('')}</div>
 <div class="stats"><div><b>${(tot('water')/1000).toFixed(1)}L</b><span class="mut">Water</span></div><div><b>${(tot('rev')/60).toFixed(1)}h</b><span class="mut">Revision</span></div><div><b>${sl.length?(sl.reduce((a,d)=>a+R(d).sleep,0)/sl.length).toFixed(1):'0'}h</b><span class="mut">Avg sleep</span></div></div>`}

function history(){
 let h=`<h1>History</h1><div class="card"><div class="grid">`;const t=today();
 for(let i=0;i<N;i++){const d=add(S.start,i),c=cnt(d);const cl=d>t?'fu':full(d)?'f':'';h+=`<div class="cell ${cl} ${d===t?'t':''}" ${d>t?'':`onclick="sel='${d}';render()"`}>${i+1}</div>`}
 h+=`</div><div class="mut" style="margin-top:12px">Green = all 6 done. Grey = not complete.</div>`;
 if(sel){const r=R(sel),f=flags(r);h+=`<div class="sheet"><b>Day ${dayNo(sel)} · ${pd(sel).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>
 ${names.map((x,i)=>`<div class="row" style="margin-top:8px"><span>${x}</span><span class="${f[i]?'g':'mut'}">${f[i]?'Done':'Missed'}</span></div>`).join('')}
 <div class="mut" style="margin-top:10px">${r.water||0} ml · ${r.rev||0} min revision · ${r.sleep||0}h sleep${r.exN?' · '+r.exN+(r.exM?' '+r.exM+'min':''):''}</div>
 <button class="btn p" style="width:100%;margin-top:12px" onclick="view=sel;go('home')">Edit this day</button></div>`}
 return h+'</div>'}

function settings(){
  let h=`<h1>Settings</h1><div class="card"><b>Challenge dates</b><div class="mut" style="margin:8px 0">Start date</div><input type="date" value="${S.start}" onchange="setStart(this.value)"><div class="row" style="margin-top:12px"><span class="mut">End date (day 50)</span><b>${pd(endDate()).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</b></div></div>
 <div class="card"><div class="row"><div><b>Reminders</b><div class="mut">Show when the app is open</div></div><button class="sw ${S.remOn?'on':''}" onclick="S.remOn=!S.remOn;save();render()"></button></div>
 ${S.rem.map((x,i)=>`<div class="hr"></div><div class="row"><div style="flex:1"><div>${x.l}</div></div><input type="time" value="${x.t}" style="width:110px" onchange="S.rem[${i}].t=this.value;save()"><button class="sw ${x.on?'on':''}" onclick="S.rem[${i}].on=!S.rem[${i}].on;save();render()"></button></div>`).join('')}
 <div class="warn" style="margin-top:14px"><b>iOS limitation, honestly:</b> this page has no server behind it, and iPhone only delivers notifications to a closed app through Web Push, which needs one. So these reminders appear as a banner at the top <b>while the app is open</b> (or just reopened). Nothing will buzz your phone when it’s closed. For alerts that work when the app is closed, use the Calendar button below.</div></div>
 <div class="card"><b>Alerts that work when closed</b><div class="mut" style="margin:6px 0 12px">Adds your enabled reminder times to Calendar as daily events with alerts for all 50 days. iOS Calendar rings even when this app is closed.</div><button class="btn p" style="width:100%" onclick="ics()">Add reminders to Calendar</button></div>
 <div class="card"><b>Install on iPhone</b><div class="mut" style="margin-top:6px">In Safari tap Share, then Add to Home Screen. and your data stays saved on this device.${navigator.serviceWorker&&navigator.serviceWorker.controller?'<div class="g" style="margin-top:8px">Offline ready</div>':''}</div></div>
 <div class="card"><b>Backup</b><div class="mut" style="margin:6px 0 12px">Your data lives only on this phone. Copy a backup into Notes now and then.</div><div class="btns" style="margin-top:0"><button class="btn p" onclick="backup()">Copy backup</button><button class="btn" onclick="restore()">Restore</button></div></div>
 <div class="card"><b>Reset challenge</b><div class="mut" style="margin:6px 0 12px">Deletes all progress and starts again from today.</div><button class="btn" style="width:100%;color:#ff6b6b" onclick="if(confirm('Delete everything and restart?')){localStorage.removeItem(KEY);location.reload()}">Reset challenge</button></div>`;
 return h}

function backup(){const j=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(()=>toast('Backup copied. Paste it into Notes to keep it safe.'),()=>prompt('Copy this backup',j));else prompt('Copy this backup',j)}
function restore(){const j=prompt('Paste your backup here');if(!j)return;let o;try{o=JSON.parse(j);if(!o.start||typeof o.days!=='object')throw 0}catch(e){toast('That does not look like a valid backup');return}
 if(!confirm('Replace everything on this device with this backup?'))return;try{localStorage.setItem(KEY+'_pre',JSON.stringify(S));localStorage.setItem(KEY,j)}catch(e){toast('Could not restore');return}location.reload()}
function ics(){
 const on=S.rem.filter(x=>x.on);if(!on.length){toast('Turn on a reminder first');return}
 const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//50DayTracker//EN\r\n';
 on.forEach(x=>{const [h,m]=x.t.split(':').map(Number),e=Math.min(1439,h*60+m+15),z=S.start.replace(/-/g,'');
  o+=`BEGIN:VEVENT\r\nUID:${x.id}-${z}@50day\r\nDTSTAMP:${st}\r\nDTSTART:${z}T${pad(h)}${pad(m)}00\r\nDTEND:${z}T${pad(Math.floor(e/60))}${pad(e%60)}00\r\nRRULE:FREQ=DAILY;COUNT=${N}\r\nSUMMARY:${x.l} (50 Day Challenge)\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${x.l}\r\nTRIGGER:PT0S\r\nEND:VALARM\r\nEND:VEVENT\r\n`});
 o+='END:VCALENDAR\r\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/calendar'}));a.download='50-day-reminders.ics';document.body.appendChild(a);a.click();a.remove();toast('Open the file, then tap Add All')}
const LW={};
function anim(){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,r=el.dataset.off!==undefined,to=r?+el.dataset.off:+el.dataset.w,from=LW[k]!==undefined?LW[k]:(r?+el.getAttribute('stroke-dasharray'):0);
 const set=v=>{if(r)el.style.strokeDashoffset=v;else el.style.width=v+'%'};el.style.transition='none';set(from);el.getBoundingClientRect();el.style.transition='';set(to);LW[k]=to})}
function render(){nav();document.getElementById('app').innerHTML={home,progress,history,settings}[tab]();anim()}
function tick1(){
 const tv=document.getElementById('tv');if(tv&&S.timer){const s=Math.floor((Date.now()-S.timer.t)/1000);tv.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}
 const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),t=today();
 if(S.remOn){S.rem.forEach(x=>{if(!x.on||x.t>hm)return;const k=t+x.id;if(S.fired[k])return;
  S.fired[k]=1;if((n.getHours()*60+n.getMinutes())-(+x.t.slice(0,2)*60+ +x.t.slice(3))>90){save();return}
  if((x.id==='bd'&&cnt(t)>0)||(x.id==='ev'&&full(t))){save();return}
  toast({am:'Morning. Let’s win today.',w1:'Time for some water.',w2:'Water check. Keep drinking.',rv:'Revision time.',ev:'Evening: tick off your checklist.',bd:'You haven’t logged anything today.'}[x.id]);save()})}
}
// icon
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0b0d0c';x.fillRect(0,0,180,180);x.strokeStyle='#2ee072';x.lineWidth=14;x.lineCap='round';x.beginPath();x.arc(90,90,54,-Math.PI/2,Math.PI*1.1);x.stroke();x.fillStyle='#fff';x.font='bold 46px -apple-system,Helvetica';x.textAlign='center';x.fillText('50',90,106);document.getElementById('ico').href=c.toDataURL('image/png')})();
function rollover(){const t=today();if(t!==lastDay){if(view===lastDay)view=t;lastDay=t;render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){rollover();tick1()}});
setInterval(()=>{rollover();tick1()},1000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();tick1();
</script></body></html>
